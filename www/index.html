<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مهر ایران دخت</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0a152c 0%, #10224a 55%, #0a152c 100%);
    color: #f3e5c3;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .card {
    border: 1.5px solid #c9a227; border-radius: 18px;
    padding: 36px 26px; max-width: 420px; width: 100%;
    background: rgba(201, 162, 39, 0.06);
    box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.12);
  }
  h1 { font-size: 28px; color: #e8c766; margin-bottom: 14px; font-weight: 700; }
  .sun { font-size: 40px; margin-bottom: 10px; }
  p { font-size: 16px; line-height: 2; color: #e9dfc8; }
  .btn {
    display: inline-block; margin-top: 22px; padding: 12px 30px;
    background: #c9a227; color: #0a152c; border-radius: 999px;
    font-size: 16px; font-weight: 700; text-decoration: none;
  }
  .small { margin-top: 18px; font-size: 13px; color: #b8ab8a; line-height: 1.9; }
</style>
</head>
<body>
  <div class="card">
    <div class="sun">☀️</div>
    <h1>مهر ایران دخت</h1>
    <p>در حال بارگذاری…<br>برای دیدن کتاب‌های کهن و اسطوره‌ای ایران، به اینترنت نیاز است.<br>اگر صفحه باز نشد، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
    <a class="btn" href="https://www.mehrirandokht.com">تلاش دوباره</a>
    <p class="small">Mehr Iran Dokht — connexion Internet requise<br>Internet connection required</p>
  </div>
</body>
</html>
